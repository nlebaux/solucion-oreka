<style>
/* ============ Oreka Cocina ============ */
/* Paleta Solución Oreka: naranja #FE9140, gris #4F4F4F, carbón #2B2B2B */
:root {
  --verde: #fe9140;
  --verde-osc: #4f4f4f;
  --verde-claro: #fbeadb;
  --dorado: #fe9140;
  --carbon: #2b2b2b;
  --crema: #f4f3f1;
  --tinta: #2b2b2b;
  --gris: #757575;
  --linea: #ddd9d3;
  --blanco: #ffffff;
  --rojo: #a53d2e;
  --radius: 10px;
  --sombra: 0 2px 10px rgba(43, 43, 43, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--crema);
  color: var(--tinta);
  font-size: 15px;
  line-height: 1.45;
}

/* ---- Barra superior ---- */
.topbar {
  background: var(--carbon);
  color: var(--blanco);
  padding: 14px 24px 0;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; }
.brand-logo { height: 42px; display: block; }
.brand-text { display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.25); padding-left: 14px; }
.brand-text strong { letter-spacing: 2px; font-size: 15px; color: #fff; }
.brand-text span { font-size: 11.5px; color: rgba(255,255,255,0.65); letter-spacing: 0.5px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  background: transparent; border: none; color: rgba(255,255,255,0.75);
  padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  border-radius: var(--radius) var(--radius) 0 0;
}
.tab:hover { color: #fff; }
.tab.active { background: var(--crema); color: var(--carbon); box-shadow: inset 0 3px 0 var(--verde); }

/* ---- Contenido ---- */
main { max-width: 1200px; margin: 0 auto; padding: 26px 24px 80px; }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 18px;
}
.toolbar h1 { font-size: 21px; color: var(--verde-osc); margin-right: auto; }
.toolbar .hint { width: 100%; color: var(--gris); font-size: 13px; }

input[type="text"], input[type="number"], input[type="search"], select, textarea {
  border: 1px solid var(--linea); border-radius: 8px;
  padding: 8px 10px; font-size: 14px; font-family: inherit;
  background: var(--blanco); color: var(--tinta);
}
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(254,145,64,0.55); }
textarea { width: 100%; resize: vertical; }

.btn {
  border: none; border-radius: 8px; padding: 9px 16px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  background: var(--verde); color: #fff;
}
.btn:hover { background: #e0782a; }
.btn.sec { background: var(--blanco); color: var(--verde-osc); border: 1px solid var(--linea); }
.btn.sec:hover { background: var(--verde-claro); }
.btn.peligro { background: var(--rojo); }
.btn.mini { padding: 4px 9px; font-size: 12.5px; }

/* ---- Tablas ---- */
.card { background: var(--blanco); border-radius: var(--radius); box-shadow: var(--sombra); overflow: auto; }
table.lista { width: 100%; border-collapse: collapse; font-size: 14px; }
table.lista th {
  text-align: left; padding: 10px 12px; background: var(--verde-claro);
  color: var(--verde-osc); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px;
  white-space: nowrap;
}
table.lista td { padding: 9px 12px; border-top: 1px solid var(--linea); vertical-align: middle; }
table.lista tr:hover td { background: #fbfaf7; }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.acciones { white-space: nowrap; text-align: right; }
td.acciones .btn { margin-left: 4px; }

.pill {
  display: inline-block; background: var(--verde-claro); color: var(--verde-osc);
  border-radius: 20px; padding: 2px 9px; font-size: 12px; font-weight: 600; margin: 1px;
}
.pill.traza { background: #f3ead6; color: #7a5b1c; }
.pill.rojo { background: #f5e3df; color: var(--rojo); }
.ok { color: #2e7d46; font-weight: 700; }
.mal { color: var(--rojo); font-weight: 700; }

.vacio { padding: 40px; text-align: center; color: var(--gris); }

/* ---- Modal ---- */
.modal-fondo {
  position: fixed; inset: 0; background: rgba(20,30,25,0.5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 30px 16px; overflow: auto; z-index: 100;
}
.modal {
  background: var(--blanco); border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  width: 100%; max-width: 860px; padding: 24px;
  max-height: calc(100vh - 60px); overflow-y: auto;
}
.modal h2 { color: var(--verde-osc); font-size: 19px; margin-bottom: 16px; }
.modal h3 { color: var(--verde-osc); font-size: 14px; text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 0 8px; border-top: 1px solid var(--linea); padding-top: 14px; }
.fila { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
.campo { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
.campo.ancho { flex-basis: 100%; }
.campo label { font-size: 12px; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: 0.4px; }
.modal-acciones { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.alerg-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.alerg-grid label {
  display: flex; align-items: center; gap: 5px; font-size: 13px;
  border: 1px solid var(--linea); border-radius: 8px; padding: 5px 9px; cursor: pointer;
}
.alerg-grid label:has(input:checked) { background: var(--verde-claro); border-color: var(--verde); }

table.lineas { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.lineas th { text-align: left; font-size: 11.5px; color: var(--gris); text-transform: uppercase; padding: 4px 6px; }
table.lineas td { padding: 4px 6px; }
table.lineas select, table.lineas input { width: 100%; }
table.lineas td.num { text-align: right; }

.resumen-coste {
  background: var(--verde-claro); border-radius: 8px; padding: 12px 14px;
  display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 14px;
}
.resumen-coste b { color: var(--verde-osc); }

.foto-preview { max-height: 90px; border-radius: 8px; display: block; margin-top: 6px; }

/* ---- Ajustes ---- */
.ajustes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.panel { background: var(--blanco); border-radius: var(--radius); box-shadow: var(--sombra); padding: 20px; }
.panel h2 { font-size: 16px; color: var(--verde-osc); margin-bottom: 12px; }
.panel p { font-size: 13.5px; color: var(--gris); margin-bottom: 12px; }
.panel .fila { margin-bottom: 12px; }

/* ---- Impresión ---- */
.print-only { display: none; }

@media print {
  .no-print { display: none !important; }
  .print-only { display: block; }
  body { background: #fff; font-size: 12.5px; }
  @page { margin: 14mm; }
}

.doc { max-width: 720px; margin: 0 auto; color: #1a1f1c; }
.doc-cab {
  display: flex; justify-content: space-between; align-items: flex-end;
  border-bottom: 3px solid var(--verde); padding-bottom: 8px; margin-bottom: 14px;
}
.doc-cab .negocio { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gris); }
.doc-cab h1 { font-size: 20px; color: var(--verde-osc); }
.doc-cab .tipo-doc { font-size: 12px; font-weight: 700; color: var(--dorado); text-transform: uppercase; letter-spacing: 1px; text-align: right; }
.doc h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--verde-osc); margin: 14px 0 6px; }
.doc table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.doc table th { background: var(--verde-claro); color: var(--verde-osc); text-align: left; padding: 5px 8px; font-size: 11px; text-transform: uppercase; }
.doc table td { padding: 5px 8px; border-bottom: 1px solid #e2ded6; }
.doc table td.num, .doc table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.doc .total td { font-weight: 700; border-top: 2px solid var(--verde); }
.doc .meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 12px; margin-bottom: 8px; }
.doc .meta span b { color: var(--verde-osc); }
.doc .foto-doc { max-width: 300px; max-height: 220px; border-radius: 6px; margin: 8px 0; }
.doc .proceso { white-space: pre-wrap; font-size: 12.5px; }
.doc .pie { margin-top: 18px; font-size: 10.5px; color: var(--gris); border-top: 1px solid #e2ded6; padding-top: 6px; display: flex; justify-content: space-between; }
.doc .marca-x { text-align: center; font-weight: 700; }
.salto { page-break-after: always; }

@media (max-width: 720px) {
  .topbar { padding: 10px 12px 0; }
  main { padding: 16px 12px 60px; }
  .tab { padding: 10px 10px; font-size: 13px; }
}

<script>
/* ============================================================
   OREKA COCINA — Gestión de cocina profesional (Solución Oreka)
   Ingredientes → Elaboraciones → Platos → Menús/Cartas
   Escandallos, alérgenos, fichas técnicas y hojas de pedido.
   Datos guardados en localStorage del navegador.
   ============================================================ */

"use strict";

// ---------- Constantes ----------
const CLAVE = "oreka-cocina-v1";

const ALERGENOS = [
  { id: "gluten",     nombre: "Gluten" },
  { id: "crustaceos", nombre: "Crustáceos" },
  { id: "huevo",      nombre: "Huevo" },
  { id: "pescado",    nombre: "Pescado" },
  { id: "cacahuete",  nombre: "Cacahuetes" },
  { id: "soja",       nombre: "Soja" },
  { id: "lacteos",    nombre: "Lácteos" },
  { id: "frutos",     nombre: "Frutos de cáscara" },
  { id: "apio",       nombre: "Apio" },
  { id: "mostaza",    nombre: "Mostaza" },
  { id: "sesamo",     nombre: "Sésamo" },
  { id: "sulfitos",   nombre: "Sulfitos" },
  { id: "altramuz",   nombre: "Altramuces" },
  { id: "moluscos",   nombre: "Moluscos" },
];

const UNIDADES_BASE = ["kg", "L", "ud"];
// Unidades de línea compatibles con cada unidad base y su factor de conversión.
const UNIDADES_LINEA = {
  kg: [{ u: "kg", f: 1 }, { u: "g", f: 0.001 }],
  L:  [{ u: "L", f: 1 }, { u: "ml", f: 0.001 }],
  ud: [{ u: "ud", f: 1 }],
};

const FAMILIAS = ["Carnes", "Pescados y mariscos", "Verduras y frutas", "Lácteos y huevos",
  "Secos y legumbres", "Aceites y grasas", "Condimentos y especias", "Panadería",
  "Bebidas", "Congelados", "Conservas", "Otros"];

const ZONAS = ["Cámara refrigeración", "Congelador", "Almacén seco", "Bodega", "Otros"];
const PARTIDAS = ["Entrantes", "Carnes", "Pescados", "Postres", "Pastelería", "Cuarto frío", "Otros"];

// ---------- Estado ----------
let state = cargar();
let tabActiva = "ingredientes";
let filtro = "";
let editLineas = []; // líneas temporales del editor de recetas

function estadoInicial() {
  return {
    config: { negocio: "Solución Oreka", moneda: "€", simboloAntes: false, iva: 10, objetivoMP: 30, decimales: 2 },
    ingredientes: [],
    elaboraciones: [],
    platos: [],
    menus: [],
  };
}

function cargar() {
  try {
    const raw = localStorage.getItem(CLAVE);
    if (raw) return Object.assign(estadoInicial(), JSON.parse(raw));
  } catch (e) { console.error("Error cargando datos", e); }
  if (typeof window !== "undefined" && window.DATOS_INICIALES) {
    const base = Object.assign(estadoInicial(), JSON.parse(JSON.stringify(window.DATOS_INICIALES)));
    base.config = Object.assign(estadoInicial().config, base.config);
    return base;
  }
  return estadoInicial();
}

function guardar() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify(state));
  } catch (e) {
    alert("No se han podido guardar los datos (¿espacio lleno? Prueba a quitar fotos grandes).");
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---------- Utilidades ----------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function n2(x) {
  const d = state.config.decimales == null ? 2 : num(state.config.decimales);
  return (isFinite(x) ? x : 0).toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function n3(x) { return (isFinite(x) ? x : 0).toLocaleString("es-ES", { maximumFractionDigits: 3 }); }
function dinero(x) {
  return state.config.simboloAntes ? state.config.moneda + n2(x) : n2(x) + " " + state.config.moneda;
}
function num(v) { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? 0 : x; }
function porId(lista, id) { return lista.find(x => x.id === id); }
function hoy() { return new Date().toLocaleDateString("es-ES"); }

// ---------- Histórico de precios ----------
function fechaISO() { return new Date().toISOString().slice(0, 10); }

// Registra un cambio de precio de compra (una entrada por valor distinto).
function registrarPrecio(ing, precio) {
  ing.historial = ing.historial || [];
  const ult = ing.historial[ing.historial.length - 1];
  if (!ult || num(ult.p) !== num(precio)) ing.historial.push({ f: fechaISO(), p: num(precio) });
}

// ---------- Cálculos de coste ----------
// Precio real por unidad base de un ingrediente (según formato de compra y rendimiento).
function precioReal(ing) {
  const contenido = num(ing.contenidoFormato) || 1;
  const rend = (num(ing.rendimiento) || 100) / 100;
  return num(ing.precioFormato) / contenido / (rend || 1);
}

// Coste de una línea de receta (cantidad ya en unidad de línea).
function costeLinea(linea, visitados) {
  visitados = visitados || new Set();
  const cant = num(linea.cantidad);
  if (linea.tipo === "ing") {
    const ing = porId(state.ingredientes, linea.refId);
    if (!ing) return 0;
    const conv = (UNIDADES_LINEA[ing.unidadBase] || []).find(c => c.u === linea.unidad);
    return cant * (conv ? conv.f : 1) * precioReal(ing);
  } else {
    const el = porId(state.elaboraciones, linea.refId);
    if (!el || visitados.has(el.id)) return 0;
    const conv = (UNIDADES_LINEA[el.prodUnidad] || []).find(c => c.u === linea.unidad);
    return cant * (conv ? conv.f : 1) * costeUnitarioElab(el, visitados);
  }
}

function costeElab(el, visitados) {
  visitados = visitados || new Set();
  visitados.add(el.id);
  if (!(el.lineas || []).length && num(el.costeRef)) return num(el.costeRef);
  return (el.lineas || []).reduce((s, l) => s + costeLinea(l, new Set(visitados)), 0);
}

// Coste por unidad producida (kg, L o ud) de una elaboración.
function costeUnitarioElab(el, visitados) {
  const prod = num(el.prodCantidad) || 1;
  return costeElab(el, visitados) / prod;
}

function costePlato(p) {
  return (p.lineas || []).reduce((s, l) => s + costeLinea(l), 0);
}
function costeRacion(p) {
  // Sin receta detallada: usa el coste de referencia (p. ej. importado de Gastrokaizen).
  if (!(p.lineas || []).length && num(p.costeRef)) return num(p.costeRef);
  return costePlato(p) / (num(p.raciones) || 1);
}
function pvpSinIva(pvp) {
  return num(pvp) / (1 + num(state.config.iva) / 100);
}
function porcentajeMP(p) {
  const base = pvpSinIva(p.pvp);
  return base > 0 ? costeRacion(p) / base * 100 : 0;
}
function pvpSugerido(p) {
  const obj = num(state.config.objetivoMP) || 30;
  return costeRacion(p) / (obj / 100) * (1 + num(state.config.iva) / 100);
}

// ---------- Alérgenos (recursivo) ----------
function alergenosDe(item, tipo, visitados) {
  visitados = visitados || new Set();
  const res = { alergenos: new Set(), trazas: new Set() };
  if (tipo === "ing") {
    (item.alergenos || []).forEach(a => res.alergenos.add(a));
    (item.trazas || []).forEach(a => res.trazas.add(a));
    return res;
  }
  if (visitados.has(item.id)) return res;
  visitados.add(item.id);
  (item.lineas || []).forEach(l => {
    const ref = l.tipo === "ing" ? porId(state.ingredientes, l.refId) : porId(state.elaboraciones, l.refId);
    if (!ref) return;
    const sub = alergenosDe(ref, l.tipo, visitados);
    sub.alergenos.forEach(a => res.alergenos.add(a));
    sub.trazas.forEach(a => res.trazas.add(a));
  });
  return res;
}

function pillsAlergenos(res) {
  const a = ALERGENOS.filter(x => res.alergenos.has(x.id)).map(x => `<span class="pill rojo">${x.nombre}</span>`);
  const t = ALERGENOS.filter(x => !res.alergenos.has(x.id) && res.trazas.has(x.id)).map(x => `<span class="pill traza">Traza: ${x.nombre}</span>`);
  const html = a.concat(t).join(" ");
  return html || '<span class="pill">Sin alérgenos declarados</span>';
}

window.guardarIngrediente = function (id) {
  const g = sel => document.getElementById(sel).value;
  const marca = tipo => Array.from(document.querySelectorAll(`input[name=${tipo}]:checked`)).map(c => c.value);
  const nombre = g("f-nombre").trim();
  if (!nombre) return alert("El nombre es obligatorio.");
  const datos = {
    nombre, familia: g("f-familia"), proveedor: g("f-proveedor").trim(), zona: g("f-zona"),
    unidadBase: g("f-unidad"), formato: g("f-formato").trim(),
    contenidoFormato: num(g("f-contenido")) || 1, precioFormato: num(g("f-precio")),
    rendimiento: num(g("f-rendimiento")) || 100,
    alergenos: marca("alergenos"), trazas: marca("trazas"), notas: g("f-notas"),
  };
  if (id) {
    const ing = porId(state.ingredientes, id);
    Object.assign(ing, datos);
    registrarPrecio(ing, datos.precioFormato);
  } else {
    const nuevo = Object.assign({ id: uid() }, datos);
    registrarPrecio(nuevo, datos.precioFormato);
    state.ingredientes.push(nuevo);
  }
  guardar(); cerrarModal(); render();
};

window.borrarIngrediente = function (id) {
  const usos = [...state.elaboraciones, ...state.platos]
    .filter(x => (x.lineas || []).some(l => l.tipo === "ing" && l.refId === id));
  if (usos.length) return alert("No se puede borrar: se usa en " + usos.map(u => u.nombre).join(", "));
  if (!confirm("¿Borrar este ingrediente?")) return;
  state.ingredientes = state.ingredientes.filter(i => i.id !== id);
  guardar(); render();
};

    <table class="lineas">

window.refrescarPrecioReal = function (id) {
  const ing = porId(state.ingredientes, id);
  if (!ing) return;
  const p = num(document.getElementById("ep-p-" + id).value);
  const r = num(document.getElementById("ep-r-" + id).value) || 100;
  const contenido = num(ing.contenidoFormato) || 1;
  const celda = document.getElementById("ep-real-" + id);
  if (celda) celda.innerHTML = `<b>${dinero(p / contenido / (r / 100))}</b>/${esc(ing.unidadBase)}`;
};

window.guardarPrecios = function () {
  let cambios = 0;
  state.ingredientes.forEach(i => {
    const campoP = document.getElementById("ep-p-" + i.id);
    const campoR = document.getElementById("ep-r-" + i.id);
    if (!campoP || !campoR) return;
    const p = num(campoP.value);
    const r = num(campoR.value) || 100;
    if (p !== num(i.precioFormato)) { i.precioFormato = p; registrarPrecio(i, p); cambios++; }
    if (r !== num(i.rendimiento)) { i.rendimiento = r; cambios++; }
  });
  guardar(); cerrarModal(); render();
  if (cambios) alert(cambios + " cambio(s) guardado(s). Costes recalculados.");
};

function graficoPrecios(h) {
  const W = 640, H = 220, mx = 70, my = 26;
  const ps = h.map(x => num(x.p));
  const min = Math.min(...ps), max = Math.max(...ps);
  const rango = (max - min) || 1;
  const X = i => mx + (h.length === 1 ? 0 : i * (W - mx - 24) / (h.length - 1));
  const Y = p => H - my - ((p - min) / rango) * (H - 2 * my);
  const pts = h.map((x, i) => `${X(i)},${Y(num(x.p))}`).join(" ");
  const puntos = h.map((x, i) =>
    `<circle cx="${X(i)}" cy="${Y(num(x.p))}" r="4" fill="#fe9140"><title>${x.f}: ${n2(num(x.p))}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border:1px solid var(--linea);border-radius:8px">
    <line x1="${mx}" y1="${Y(max)}" x2="${W - 24}" y2="${Y(max)}" stroke="#eee"/>
    <line x1="${mx}" y1="${Y(min)}" x2="${W - 24}" y2="${Y(min)}" stroke="#eee"/>
    <polyline points="${pts}" fill="none" stroke="#fe9140" stroke-width="2.5"/>
    ${puntos}
    <text x="6" y="${Y(max) + 4}" font-size="12" fill="#777">${n2(max)}</text>
    <text x="6" y="${Y(min) + 4}" font-size="12" fill="#777">${n2(min)}</text>
    <text x="${mx}" y="${H - 6}" font-size="11" fill="#777">${h[0].f}</text>
    <text x="${W - 110}" y="${H - 6}" font-size="11" fill="#777">${h[h.length - 1].f}</text>
  </svg>`;
}

window.verHistorialPrecio = function (id) {
  const ing = porId(state.ingredientes, id);
  if (!ing) return;
  const h = (ing.historial || []).slice();
  if (!h.length || num(h[h.length - 1].p) !== num(ing.precioFormato)) {
    h.push({ f: fechaISO(), p: num(ing.precioFormato) });
  }
  const variacion = h.length >= 2 && num(h[0].p) > 0
    ? (num(h[h.length - 1].p) / num(h[0].p) - 1) * 100 : 0;
  const filas = h.slice().reverse().map((x, idx, arr) => {
    const ant = arr[idx + 1];
    const dif = ant && num(ant.p) > 0 ? (num(x.p) / num(ant.p) - 1) * 100 : null;
    return `<tr><td>${x.f}</td><td class="num">${dinero(num(x.p))}</td>
      <td class="num">${dif == null ? "—" : `<span class="${dif <= 0 ? "ok" : "mal"}">${dif > 0 ? "+" : ""}${n2(dif)} %</span>`}</td></tr>`;
  }).join("");
  abrirModal(`
    <h2>${esc(ing.nombre)} · Evolución del precio de compra</h2>
    <p style="font-size:13px;color:var(--gris);margin-bottom:10px">Formato: ${esc(ing.formato || "—")} (${n3(ing.contenidoFormato)} ${esc(ing.unidadBase)})${h.length >= 2 ? ` · Variación total: <b class="${variacion <= 0 ? "ok" : "mal"}">${variacion > 0 ? "+" : ""}${n2(variacion)} %</b>` : ""}</p>
    ${h.length < 2
      ? `<p>Todavía no hay cambios registrados. Cada vez que actualices el precio de compra (en la ficha o en «Editar precios») quedará guardado aquí.</p>`
      : graficoPrecios(h)}
    <table class="lineas" style="margin-top:12px">
      <thead><tr><th>Fecha</th><th style="text-align:right">Precio</th><th style="text-align:right">Variación</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>
    <div class="modal-acciones"><button class="btn sec" onclick="cerrarModal()">Cerrar</button></div>`);
};

let fotoActual = "";
window.cargarFoto = function (input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const img = new Image();
  const lector = new FileReader();
  lector.onload = () => {
    img.onload = () => {
      const MAX = 800;
      const escala = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * escala);
      c.height = Math.round(img.height * escala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      fotoActual = c.toDataURL("image/jpeg", 0.75);
      const prev = document.getElementById("foto-preview");
      prev.src = fotoActual; prev.style.display = "block";
    };
    img.src = lector.result;
  };
  lector.readAsDataURL(f);
};

function vistaMenus() {
  const lista = state.menus.filter(m => coincide(m.nombre));
  const obj = num(state.config.objetivoMP) || 30;
  const filas = lista.map(m => {
    const platos = platosDeMenu(m);
    const esMenu = m.tipo === "menu";
    const coste = platos.reduce((s, p) => s + costeRacion(p), 0);
    let celCoste = "—", celPvp = "—", rentab = "—";
    if (esMenu) {
      // Menú de precio cerrado: coste MP por comensal frente al PVP del menú.
      celCoste = dinero(coste);
      if (num(m.pvp)) {
        celPvp = dinero(m.pvp);
        const base = pvpSinIva(m.pvp);
        const mp = base > 0 ? coste / base * 100 : 0;
        rentab = `<span class="${mp <= obj ? "ok" : "mal"}">${n2(mp)} %</span>`;
      }
    } else if (platos.length) {
      // Carta: cada plato tiene su PVP → medias por plato y % MP global de la carta.
      const conPvp = platos.filter(p => num(p.pvp) > 0);
      celCoste = dinero(coste / platos.length) + " <small>media</small>";
      if (conPvp.length) {
        const pvpMedio = conPvp.reduce((s, p) => s + num(p.pvp), 0) / conPvp.length;
        celPvp = dinero(pvpMedio) + " <small>media</small>";
        const costeConPvp = conPvp.reduce((s, p) => s + costeRacion(p), 0);
        const baseTotal = conPvp.reduce((s, p) => s + pvpSinIva(p.pvp), 0);
        const mp = baseTotal > 0 ? costeConPvp / baseTotal * 100 : 0;
        rentab = `<span class="${mp <= obj ? "ok" : "mal"}">${n2(mp)} %</span> <small>global</small>`;
      }
    }
    return `<tr>
      <td><b>${esc(m.nombre)}</b><br><small style="color:var(--gris)">${esMenu ? "Menú" : "Carta"} · ${platos.length} platos</small></td>

  return toolbar("Menús y cartas", `<button class="btn" onclick="editarMenu()">+ Nuevo menú / carta</button>`,
    "Agrupa platos en menús o cartas: coste por comensal, carta de alérgenos y hoja de pedido por proveedor.") +

function htmlDetalleMenu(m, claseTabla) {
  const obj = num(state.config.objetivoMP) || 30;
  let totCoste = 0, totPvp = 0, totBase = 0, totCosteConPvp = 0, nPlatos = 0, nConPvp = 0;
  const cuerpo = (m.secciones || []).map(s => {
    const filas = s.platoIds.map(pid => {
      const p = porId(state.platos, pid);
      if (!p) return "";
      const cr = costeRacion(p);
      const pvp = num(p.pvp);
      const base = pvpSinIva(pvp);
      const mp = base > 0 ? cr / base * 100 : 0;
      const esRef = !(p.lineas || []).length && num(p.costeRef);
      totCoste += cr; nPlatos++;
      if (pvp > 0) { totPvp += pvp; totBase += base; totCosteConPvp += cr; nConPvp++; }
      return `<tr>
        <td>${esc(p.nombre)}${esRef ? ' <small>(coste ref.)</small>' : ""}</td>
        <td class="num">${dinero(cr)}</td>
        <td class="num">${pvp > 0 ? dinero(pvp) : "—"}</td>
        <td class="num">${pvp > 0 ? `<span class="${mp <= obj ? "ok" : "mal"}">${n2(mp)} %</span>` : "—"}</td>
        <td class="num">${pvp > 0 ? dinero(base - cr) : "—"}</td>
      </tr>`;
    }).join("");
    return `<tr><td colspan="5" style="background:var(--verde-claro);font-weight:700">${esc(s.nombre)}</td></tr>` + filas;
  }).join("");
  const mpGlobal = totBase > 0 ? totCosteConPvp / totBase * 100 : 0;
  const resumen = `<tr class="total">
    <td>TOTAL (${nPlatos} platos${nConPvp < nPlatos ? `, ${nConPvp} con PVP` : ""})</td>

  let extraMenu = "";
  if (m.tipo === "menu" && num(m.pvp)) {
    const baseMenu = pvpSinIva(m.pvp);

      margen bruto/comensal <b>${dinero(baseMenu - totCoste)}</b></p>`;
  }
  return `<table${claseTabla ? ` class="${claseTabla}"` : ""}>
    <thead><tr><th>Plato</th><th class="num">Coste/ración</th><th class="num">PVP (IVA incl.)</th><th class="num">% Coste MP</th><th class="num">Margen bruto</th></tr></thead>
    <tbody>${cuerpo}${resumen}</tbody>
  </table>${extraMenu}`;
}

// ---- Export / import CSV (compatible con Excel) ----
function csvCelda(v) {
  v = String(v == null ? "" : v);
  return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
// Números con coma decimal y sin separador de miles, para que Excel es-ES los lea bien.
function csvNum(x) {
  return String(Math.round((isFinite(x) ? x : 0) * 100) / 100).replace(".", ",");
}
function descargarCSV(nombreArchivo, filas) {
  const texto = "﻿" + filas.map(f => f.map(csvCelda).join(";")).join("\r\n");
  const blob = new Blob([texto], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombreArchivo;
  a.click();
  URL.revokeObjectURL(a.href);
}
function nombresAlergenos(ids) {
  return ALERGENOS.filter(a => (ids || []).includes(a.id)).map(a => a.nombre).join(", ");
}

// Parser CSV sencillo con soporte de comillas.
function parsearCSV(texto) {
  const lineas = texto.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
  if (!lineas.length) return [];
  const sep = (lineas[0].match(/;/g) || []).length >= (lineas[0].match(/,/g) || []).length ? ";" : ",";
  return lineas.map(linea => {
    const celdas = [];
    let actual = "", enComillas = false;
    for (let c = 0; c < linea.length; c++) {
      const ch = linea[c];
      if (enComillas) {
        if (ch === '"' && linea[c + 1] === '"') { actual += '"'; c++; }
        else if (ch === '"') enComillas = false;
        else actual += ch;
      } else if (ch === '"') enComillas = true;
      else if (ch === sep) { celdas.push(actual); actual = ""; }
      else actual += ch;
    }
    celdas.push(actual);
    return celdas.map(x => x.trim());
  });
}

function normalizarTexto(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

window.importarIngredientesCSV = function (input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const lector = new FileReader();
  lector.onload = function () {
    const filas = parsearCSV(String(lector.result));
    input.value = "";
    if (filas.length < 2) return alert("El archivo no tiene datos (se espera cabecera + filas).");
    const cab = filas[0].map(normalizarTexto);
    const col = claves => cab.findIndex(c => claves.some(k => c.includes(k)));
    const ix = {
      nombre: col(["nombre", "ingrediente"]), familia: col(["familia"]), proveedor: col(["proveedor"]),
      zona: col(["zona"]), unidad: col(["unidad"]), formato: col(["formato"]),
      contenido: col(["contenido"]), precio: col(["precio compra", "precio"]), rendimiento: col(["rendimiento"]),
    };
    if (ix.nombre < 0) return alert("No encuentro la columna «Nombre». Descarga la plantilla para ver el formato.");
    let creados = 0, actualizados = 0, sinCambio = 0;
    filas.slice(1).forEach(fila => {
      const nombre = (fila[ix.nombre] || "").trim();
      if (!nombre) return;
      const val = i => (i >= 0 && fila[i] != null && fila[i] !== "" ? fila[i] : null);
      const existente = state.ingredientes.find(x => normalizarTexto(x.nombre) === normalizarTexto(nombre));
      if (existente) {
        let cambio = false;
        const precio = val(ix.precio);
        if (precio != null && num(precio) !== num(existente.precioFormato)) {
          existente.precioFormato = num(precio); registrarPrecio(existente, num(precio)); cambio = true;
        }
        [["familia", "familia"], ["proveedor", "proveedor"], ["zona", "zona"], ["formato", "formato"]].forEach(([campo, clave]) => {
          const v = val(ix[clave]);
          if (v != null && v !== existente[campo]) { existente[campo] = v; cambio = true; }
        });
        const cont = val(ix.contenido), rend = val(ix.rendimiento);
        if (cont != null && num(cont) !== num(existente.contenidoFormato)) { existente.contenidoFormato = num(cont) || 1; cambio = true; }
        if (rend != null && num(rend) !== num(existente.rendimiento)) { existente.rendimiento = num(rend) || 100; cambio = true; }
        cambio ? actualizados++ : sinCambio++;
      } else {
        const unidad = normalizarTexto(val(ix.unidad) || "kg");
        const nuevo = {
          id: uid(), nombre, familia: val(ix.familia) || "", proveedor: val(ix.proveedor) || "",
          zona: val(ix.zona) || "", unidadBase: UNIDADES_BASE.includes(unidad) ? unidad : (unidad === "l" ? "L" : "kg"),
          formato: val(ix.formato) || "", contenidoFormato: num(val(ix.contenido)) || 1,
          precioFormato: num(val(ix.precio)), rendimiento: num(val(ix.rendimiento)) || 100,
          alergenos: [], trazas: [],
        };
        registrarPrecio(nuevo, nuevo.precioFormato);
        state.ingredientes.push(nuevo);
        creados++;
      }
    });
    guardar(); render();
    alert(`Importación completada: ${creados} creado(s), ${actualizados} actualizado(s), ${sinCambio} sin cambios.\nRecuerda completar los alérgenos de los ingredientes nuevos.`);
  };
  lector.readAsText(f);
};

      if (!datos.ingredientes || !datos.config) throw new Error("Formato no válido");

function pieDoc() {
  return `<div class="pie"><span>${esc(state.config.negocio)} · Oreka Cocina</span><span>Generado el ${hoy()}</span></div>`;
}

function imprimirDoc(html) {
  document.getElementById("print-root").innerHTML = html;
  window.print();
}

function tablaComposicion(lineas) {
  const filas = lineas.map(l => {
    const ref = l.tipo === "ing" ? porId(state.ingredientes, l.refId) : porId(state.elaboraciones, l.refId);
    return `<tr>
      <td>${ref ? esc(ref.nombre) : "?"} ${l.tipo === "elab" ? "<small>(elaboración)</small>" : ""}</td>
      <td class="num">${n3(l.cantidad)} ${esc(l.unidad)}</td>
      <td class="num">${dinero(costeLinea(l))}</td>
    </tr>`;
  }).join("");
  return `<table><thead><tr><th>Componente</th><th class="num">Cantidad</th><th class="num">Coste</th></tr></thead><tbody>${filas}</tbody></table>`;
}

};

window.imprimirEscandallo = function (id) {
  const p = porId(state.platos, id);
  if (!p) return;
  const hayLineas = (p.lineas || []).length > 0;
  const coste = costePlato(p);
  const cr = costeRacion(p);
  const base = pvpSinIva(p.pvp);
  const mp = base > 0 ? cr / base * 100 : 0;
  imprimirDoc(`<div class="doc">
    ${cabeceraDoc(p.nombre, "Escandallo")}
    <h2>Coste de materia prima</h2>
    ${hayLineas ? tablaComposicion(p.lineas) : `<p style="font-size:12px">Sin receta detallada: se usa el coste de materia prima de referencia.</p>`}
    <table style="margin-top:10px">
      ${hayLineas ? `<tr class="total"><td>Coste total receta (${n3(p.raciones)} raciones)</td><td class="num">${dinero(coste)}</td></tr>` : ""}
      <tr class="total"><td>Coste por ración${hayLineas ? "" : " (referencia)"}</td><td class="num">${dinero(cr)}</td></tr>
      ${num(p.pvp) ? `
      <tr><td>PVP por ración (IVA ${n2(state.config.iva)} % incl.)</td><td class="num">${dinero(p.pvp)}</td></tr>
      <tr><td>PVP sin IVA</td><td class="num">${dinero(base)}</td></tr>
      <tr><td>% coste materia prima</td><td class="num">${n2(mp)} %</td></tr>
      <tr><td>Margen bruto por ración</td><td class="num">${dinero(base - cr)}</td></tr>` : ""}
      <tr><td>PVP sugerido (objetivo ${n2(state.config.objetivoMP)} % MP)</td><td class="num">${dinero(pvpSugerido(p))}</td></tr>
    </table>
    ${p.notas ? `<h2>Notas</h2><div class="proceso">${esc(p.notas)}</div>` : ""}
    ${pieDoc()}
  </div>`);
};

window.imprimirAlergenosMenu = function (id) {
  const m = porId(state.menus, id);
  if (!m) return;
  const cab = ALERGENOS.map(a => `<th style="writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 3px;font-size:9.5px">${a.nombre}</th>`).join("");
  const cuerpo = (m.secciones || []).map(s => {
    const filasPlatos = s.platoIds.map(pid => {
      const p = porId(state.platos, pid);
      if (!p) return "";
      const al = alergenosDe(p, "plato");
      const celdas = ALERGENOS.map(a =>
        `<td class="marca-x">${al.alergenos.has(a.id) ? "●" : (al.trazas.has(a.id) ? "◦" : "")}</td>`).join("");
      return `<tr><td>${esc(p.nombre)}</td>${celdas}</tr>`;
    }).join("");
    return `<tr><td colspan="${ALERGENOS.length + 1}" style="background:var(--verde-claro);font-weight:700">${esc(s.nombre)}</td></tr>` + filasPlatos;
  }).join("");
  imprimirDoc(`<div class="doc">
    ${cabeceraDoc(m.nombre, "Carta de alérgenos")}
    <table><thead><tr><th>Plato</th>${cab}</tr></thead><tbody>${cuerpo}</tbody></table>
    <p style="margin-top:8px;font-size:11px">● contiene &nbsp;&nbsp; ◦ puede contener trazas. Información conforme al Reglamento (UE) 1169/2011.</p>
    ${pieDoc()}
  </div>`);
};

// Hoja de pedido: agrega cantidades brutas de ingredientes del menú, por proveedor.
window.imprimirPedido = function (id) {
  const m = porId(state.menus, id);
  if (!m) return;
  const comensales = num(m.comensales) || 1;
  const necesidades = {}; // ingId -> cantidad neta en unidad base

  function acumularLineas(lineas, factor, visitados) {
    (lineas || []).forEach(l => {
      const cant = num(l.cantidad) * factor;
      if (l.tipo === "ing") {
        const ing = porId(state.ingredientes, l.refId);
        if (!ing) return;
        const conv = (UNIDADES_LINEA[ing.unidadBase] || []).find(c => c.u === l.unidad);
        necesidades[ing.id] = (necesidades[ing.id] || 0) + cant * (conv ? conv.f : 1);
      } else {
        const el = porId(state.elaboraciones, l.refId);
        if (!el || visitados.has(el.id)) return;
        const conv = (UNIDADES_LINEA[el.prodUnidad] || []).find(c => c.u === l.unidad);
        const proporcion = (cant * (conv ? conv.f : 1)) / (num(el.prodCantidad) || 1);
        const v2 = new Set(visitados); v2.add(el.id);
        acumularLineas(el.lineas, proporcion, v2);
      }
    });
  }

  platosDeMenu(m).forEach(p => {
    const factor = comensales / (num(p.raciones) || 1); // raciones necesarias / raciones de la receta
    acumularLineas(p.lineas, factor, new Set());
  });

  // Agrupar por proveedor
  const porProveedor = {};
  Object.entries(necesidades).forEach(([ingId, neto]) => {
    const ing = porId(state.ingredientes, ingId);
    if (!ing) return;
    const bruto = neto / ((num(ing.rendimiento) || 100) / 100);
    const prov = ing.proveedor || "Sin proveedor";
    (porProveedor[prov] = porProveedor[prov] || []).push({ ing, neto, bruto });
  });

  const bloques = Object.keys(porProveedor).sort().map(prov => {
    const filas = porProveedor[prov].sort((a, b) => a.ing.nombre.localeCompare(b.ing.nombre)).map(x =>
      `<tr><td>${esc(x.ing.nombre)}</td><td>${esc(x.ing.formato || "—")}</td>
       <td class="num">${n3(x.neto)} ${esc(x.ing.unidadBase)}</td>
       <td class="num"><b>${n3(x.bruto)} ${esc(x.ing.unidadBase)}</b></td>
       <td class="num">${dinero(x.bruto * precioReal(x.ing) * ((num(x.ing.rendimiento) || 100) / 100))}</td></tr>`).join("");
    return `<h2>${esc(prov)}</h2>
      <table><thead><tr><th>Ingrediente</th><th>Formato</th><th class="num">Neto</th><th class="num">Bruto a pedir</th><th class="num">Coste aprox.</th></tr></thead>
      <tbody>${filas}</tbody></table>`;
  }).join("");

  imprimirDoc(`<div class="doc">
    ${cabeceraDoc(m.nombre, "Hoja de pedido")}
    <div class="meta"><span><b>Comensales:</b> ${comensales}</span><span><b>Platos:</b> ${platosDeMenu(m).length}</span></div>
    ${bloques || "<p>No hay ingredientes que pedir.</p>"}
    ${pieDoc()}
  </div>`);
};

// MODALES
// ============================================================
function abrirModal(html) {
  document.getElementById("modal-root").innerHTML =
    `<div class="modal-fondo" onclick="if(event.target===this)cerrarModal()"><div class="modal">${html}</div></div>`;
}
window.cerrarModal = function () {
  document.getElementById("modal-root").innerHTML = "";
};

// ---------- Arranque ----------
render();

</script>
